<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img">
  <title>Nødboks</title>

  <!--
    Glødepunktet.

    Ringen er det uladede pigmentet, kjernen er ettergløden: samme kulør,
    motsatt valør. Det er nøyaktig mekanikken paletten er utledet fra
    (strontiumaluminat, se docs/farger.md), oversatt til geometri i stedet for
    til en illustrasjon av emballasjen.

    Kontrasten mellom åpen ring og fylt kjerne ER lysvirkningen. Ingen stråler,
    ingen gradient, ingen glød lagt oppå. Se docs/profil.md, avsnittet Merket.

    Fargekontrakten:
      ringen  = currentColor, og arver tekstfargen der merket står
      kjernen = aksent-tokenet, som er uladet #52601B i lys modus og
                ettergløden #D9E6A0 i mørk

    svg:root-regelen under gjelder KUN når denne filen åpnes eller lastes
    alene (favicon, img-element, trykkoriginal). Når filen limes inn i et
    HTML-dokument er :root html-elementet, ikke denne svg-en, og reglene slår
    derfor ikke til. Da gjelder sidens egne tokens, slik de skal.
  -->
  <style>
    svg:root { color: #12211D; }
    @media (prefers-color-scheme: dark) {
      svg:root { color: #E8EFE9; }
      svg:root .kjerne { fill: #D9E6A0; }
    }
  </style>

  <circle cx="16" cy="16" r="10.5" fill="none" stroke="currentColor" stroke-width="3"/>
  <circle class="kjerne" cx="16" cy="16" r="5" fill="var(--accent, #52601B)"/>
</svg>
